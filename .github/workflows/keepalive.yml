# Stops the free-tier Supabase project pausing for inactivity. See HANDOVER.md.
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 6 * * 1,4"   # Mondays and Thursdays, 06:17 UTC
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the enquiry function
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 10 --max-time 30 \
            https://gprluocthtaaggxfmjta.supabase.co/functions/v1/enquiry
